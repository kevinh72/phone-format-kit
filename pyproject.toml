[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonefmt"
version = "0.1.0"
description = "Recognize and normalize phone numbers found in free text, files, or stdin."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "kevinh72" }]

[tool.setuptools.packages.find]
where = ["src"]
